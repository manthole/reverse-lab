# Vérifie les règles de détection à chaque publication.
# Actions épinglées par empreinte de commit.
name: regles

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Outils
        run: pip install yara-python sigma-cli
      - name: Règles YARA (compilation, vrais et faux positifs)
        run: python3 scripts/verifier_regles.py
      - name: Règles Sigma (syntaxe et bonnes pratiques)
        run: sigma check regles/sigma modeles/regle-sigma.yml
